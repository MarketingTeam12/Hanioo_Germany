<svg width="640" height="200" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600&amp;display=swap');
    </style>
    <linearGradient id="hn-bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="hn-letter2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>

  <!-- icon badge -->
  <rect x="4" y="34" width="132" height="132" rx="32" fill="url(#hn-bg2)"/>
  <rect x="4" y="34" width="132" height="132" rx="32" fill="none" stroke="#3B82F6" stroke-opacity="0.35" stroke-width="2"/>
  <text x="70" y="138" text-anchor="middle"
        font-family="'Fraunces','Noto Serif',Georgia,serif" font-weight="600"
        font-size="74" fill="url(#hn-letter2)">H</text>
  <circle cx="103" cy="62" r="5.5" fill="#0EA5E9"/>

  <!-- English wordmark -->
  <text x="166" y="112" font-family="'Fraunces','Noto Serif',Georgia,serif" font-weight="600"
        font-size="66" fill="#FFFFFF" letter-spacing="0.5">Hanioo</text>

  <!-- thin blue rule separating word from Danish line -->
  <rect x="169" y="122" width="150" height="2.5" rx="1.25" fill="#3B82F6" fill-opacity="0.55"/>

  <!-- Danish line -->
  <text x="168" y="150" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-weight="500"
        font-size="26" fill="#FFFFFF" letter-spacing="0.5">Tolkeservice</text>
</svg>
